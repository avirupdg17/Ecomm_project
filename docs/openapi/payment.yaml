openapi: 3.0.3
info:
  title: ecom-payment-service
  version: 0.1.0
security:
- bearerAuth: []
paths:
  /api/payments:
    post:
      x-roles:
      - SERVICE
      - ADMIN
      summary: Create payment
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '200':
          description: Existing transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '422':
          $ref: '#/components/responses/ApiError422'
      description: 'Allowed roles: SERVICE or ADMIN.'
    get:
      x-roles:
      - CUSTOMER
      - SERVICE
      - ADMIN
      summary: List order transactions
      parameters:
      - name: orderId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
      description: 'Allowed roles: CUSTOMER or SERVICE or ADMIN.'
  /api/payments/{id}:
    get:
      x-roles:
      - CUSTOMER
      - SERVICE
      - ADMIN
      summary: Get transaction
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
      description: 'Allowed roles: CUSTOMER or SERVICE or ADMIN.'
  /api/payments/{id}/refund:
    post:
      x-roles:
      - SERVICE
      - ADMIN
      summary: Refund payment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '409':
          $ref: '#/components/responses/ApiError409'
      description: 'Allowed roles: SERVICE or ADMIN.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - timestamp
      - status
      - error
      - code
      - message
      - path
      - correlationId
      - details
      properties:
        timestamp:
          type: string
        status:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        details:
          type: array
          items:
            type: object
            required:
            - field
            - issue
            properties:
              field:
                type: string
              issue:
                type: string
    PaymentRequest:
      type: object
      required:
      - orderId
      - customerId
      - amount
      - currency
      properties:
        orderId:
          type: string
        customerId:
          type: string
        amount:
          type: number
        currency:
          type: string
        simulatedOutcome:
          type: string
    Payment:
      type: object
      required:
      - id
      - orderId
      - amount
      - currency
      - status
      - failureReason
      - createdAt
      - attempts
      properties:
        id:
          type: string
        orderId:
          type: string
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
        failureReason:
          type: string
        createdAt:
          type: string
        attempts:
          type: array
          items:
            type: object
            additionalProperties: true
    RefundRequest:
      type: object
      required:
      - reason
      properties:
        amount:
          type: number
        reason:
          type: string
    Refund:
      type: object
      required:
      - refundId
      - status
      properties:
        refundId:
          type: string
        status:
          type: string
          enum:
          - COMPLETED
  responses:
    ApiError409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError422:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
servers:
- url: http://localhost:8086
