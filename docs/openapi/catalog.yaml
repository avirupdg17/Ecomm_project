openapi: 3.0.3
info:
  title: ecom-catalog-service
  version: 0.1.0
security:
- bearerAuth: []
paths:
  /api/categories:
    post:
      x-roles:
      - ADMIN
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '409':
          $ref: '#/components/responses/ApiError409'
      description: 'Allowed roles: ADMIN.'
    get:
      x-roles: []
      summary: List categories
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      description: 'Allowed roles: public (no authentication).'
  /api/products:
    post:
      x-roles:
      - ADMIN
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ApiError400'
        '409':
          $ref: '#/components/responses/ApiError409'
      description: 'Allowed roles: ADMIN.'
    get:
      x-roles: []
      summary: List products
      security: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      description: 'Allowed roles: public (no authentication).'
  /api/products/{id}:
    get:
      x-roles: []
      summary: Get product
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ApiError404'
      description: 'Allowed roles: public (no authentication).'
    put:
      x-roles:
      - ADMIN
      summary: Update product
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ApiError404'
        '409':
          $ref: '#/components/responses/ApiError409'
      description: 'Allowed roles: ADMIN.'
  /api/products/search:
    get:
      x-roles: []
      summary: Search products
      security: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: categoryId
        in: query
        schema:
          type: string
      - name: minPrice
        in: query
        schema:
          type: number
      - name: maxPrice
        in: query
        schema:
          type: number
      - name: active
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
      - name: size
        in: query
        schema:
          type: integer
      - name: sort
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
      description: 'Allowed roles: public (no authentication).'
  /api/products/by-sku/{sku}:
    get:
      x-roles: []
      summary: Get product by SKU
      security: []
      parameters:
      - name: sku
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      description: 'Allowed roles: public (no authentication).'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required:
      - timestamp
      - status
      - error
      - code
      - message
      - path
      - correlationId
      - details
      properties:
        timestamp:
          type: string
        status:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        path:
          type: string
        correlationId:
          type: string
        details:
          type: array
          items:
            type: object
            required:
            - field
            - issue
            properties:
              field:
                type: string
              issue:
                type: string
    CategoryRequest:
      type: object
      required:
      - name
      - description
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
    Category:
      allOf:
      - $ref: '#/components/schemas/CategoryRequest'
      type: object
    Price:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
        currency:
          type: string
    ProductRequest:
      type: object
      required:
      - sku
      - name
      - description
      - categoryId
      - price
      - active
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        active:
          type: boolean
    Product:
      allOf:
      - $ref: '#/components/schemas/ProductRequest'
      type: object
    Page:
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
  responses:
    ApiError400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ApiError409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
servers:
- url: http://localhost:8082
