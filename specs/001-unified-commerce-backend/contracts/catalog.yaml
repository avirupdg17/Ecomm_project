openapi: 3.0.3
info: {title: Catalog API, version: v1}
servers: [{url: http://localhost:8082}]
paths:
  /api/products: {get: {summary: Browse products, security: [], responses: {"200": {description: Page}}}, post: {summary: Create product, responses: {"201": {description: Created}, "409": {description: Duplicate SKU}}}}
  /api/products/search: {get: {summary: Search products, security: [], responses: {"200": {description: Page}}}}
  /api/products/{id}: {get: {summary: Read product, security: [], responses: {"200": {description: Product}, "404": {description: Not found}}}, put: {summary: Update product, responses: {"200": {description: Updated}}}}
  /api/categories: {get: {summary: Browse categories, security: [], responses: {"200": {description: Categories}}}, post: {summary: Create category, responses: {"201": {description: Created}}}}
